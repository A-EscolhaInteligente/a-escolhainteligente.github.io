<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha Inteligente | Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f7f5f0;
            --text-main: #252525;
            --accent-gold: #b59b85;
            --button-bg: #ffffff;
            --font-base: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-base);
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
        }

        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            padding: 40px 24px;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.03);
        }

        .profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 16px;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .profile-name {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .profile-subtitle {
            font-size: 13px;
            color: #888888;
            margin-bottom: 32px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ambient-btn {
            display: flex;
            align-items: center;
            background-color: var(--button-bg);
            color: var(--text-main);
            text-decoration: none;
            padding: 18px 20px;
            border-radius: 18px;
            margin-bottom: 14px;
            border: 1px solid #eaeaea;
            transition: all 0.2s ease;
        }

        .ambient-btn:hover {
            border-color: var(--accent-gold);
            background-color: #fdfbf7;
            transform: translateY(-1px);
        }

        .ambient-btn i.icon-left {
            font-size: 20px;
            margin-right: 16px;
            color: var(--accent-gold);
            width: 24px;
            text-align: center;
        }

        .ambient-btn span {
            flex-grow: 1;
            text-align: left;
            font-size: 15px;
            font-weight: 600;
        }

        .ambient-btn i.arrow-right {
            font-size: 12px;
            color: #cccccc;
        }

        .footer {
            margin-top: 40px;
            font-size: 11px;
            color: #c0c0c0;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="perfil.png" alt="Escolha Inteligente" class="profile-img">
        <h1 class="profile-name">Escolha Inteligente</h1>
        <div class="profile-subtitle">Achadinhos Exclusivos</div>
        
        <a href="casa.html" class="ambient-btn">
            <i class="fa-solid fa-house icon-left"></i>
            <span>Espaço Casa & Decoração</span>
            <i class="fa-solid fa-chevron-right arrow-right"></i>
        </a>
        
        <div class="ambient-btn" style="opacity: 0.6;" onclick="alert('O espaço de Moda está sendo preparado com tendências incríveis e estará disponível em breve.')">
            <i class="fa-solid fa-shirt icon-left"></i>
            <span>Moda & Tendências (Em breve)</span>
            <i class="fa-solid fa-lock arrow-right" style="font-size:11px;"></i>
        </div>

        <div class="ambient-btn" style="opacity: 0.6;" onclick="alert('O espaço de Tecnologia trará os gadgets mais modernos em breve.')">
            <i class="fa-solid fa-laptop icon-left"></i>
            <span>Tecnologia & Gadgets (Em breve)</span>
            <i class="fa-solid fa-lock arrow-right" style="font-size:11px;"></i>
        </div>

        <div class="footer">
            © Escolha Inteligente
        </div>
    </div>
</body>
</html>
