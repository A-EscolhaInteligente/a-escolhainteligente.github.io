<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha Inteligente | Portais Oficiais</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #fcfcfc;
            --text-main: #2c2c2c;
            --accent-premium: #f2e3d5;
            --accent-hover: #e5d2c0;
            --accent-disabled: #f5ece4;
            --font-base: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            font-family: var(--font-base);
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
        }

        .container {
            width: 90%;
            max-width: 420px;
            text-align: center;
            padding: 40px 24px;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.03);
        }

        /* Foto de Perfil */
        .profile-img {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            margin-bottom: 18px;
        }

        .profile-name {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 10px 0;
            letter-spacing: -0.5px;
        }

        .profile-description {
            font-size: 14.5px;
            color: #666666;
            margin: 0 0 36px 0;
            line-height: 1.6;
        }

        .menu-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #999999;
            margin-bottom: 16px;
            font-weight: 600;
        }

        /* Botões dos Ambientes */
        .ambient-btn {
            display: flex;
            align-items: center;
            background-color: var(--accent-premium);
            color: var(--text-main);
            text-decoration: none;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 14px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.25s ease;
            border: 1px solid rgba(0,0,0,0.02);
            cursor: pointer;
        }

        .ambient-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        /* Estilo sutil para os que estão em breve */
        .ambient-btn.coming-soon {
            background-color: var(--accent-disabled);
            opacity: 0.85;
        }

        .ambient-btn.coming-soon:hover {
            transform: none;
            background-color: var(--accent-disabled);
        }

        .ambient-btn i.icon-left {
            font-size: 20px;
            margin-right: 16px;
            color: #b59b85;
            width: 24px;
            text-align: center;
        }

        .ambient-btn .btn-text {
            flex-grow: 1;
            text-align: left;
            display: flex;
            flex-direction: column;
        }

        .coming-soon-badge {
            font-size: 10px;
            text-transform: uppercase;
            color: #b59b85;
            letter-spacing: 1px;
            margin-top: 2px;
            font-weight: 700;
        }

        .ambient-btn i.arrow-right {
            font-size: 12px;
            opacity: 0.4;
        }

        .footer {
            margin-top: 45px;
            font-size: 11px;
            color: #c0c0c0;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="perfil.png" alt="Escolha Inteligente" class="profile-img">
        
        <h1 class="profile-name">Escolha Inteligente</h1>
        <p class="profile-description">
            Sua curadoria exclusiva de produtos na internet.<br>
            Explore nossos cenários inspiradores abaixo.
        </p>

        <div class="menu-label">Selecione um Espaço</div>
        
        <a href="casa.html" class="ambient-btn">
            <i class="fa-solid fa-house-chimney icon-left"></i>
            <span class="btn-text">Espaço Casa & Decoração</span>
            <i class="fa-solid fa-chevron-right arrow-right"></i>
        </a>
        
        <div class="ambient-btn coming-soon" onclick="alert('O Espaço Tecnologia está sendo decorado com produtos incríveis e estará disponível em breve!')">
            <i class="fa-solid fa-laptop-code icon-left"></i>
            <span class="btn-text">
                <span>Espaço Tecnologia & Setup</span>
                <span class="coming-soon-badge">Em breve</span>
            </span>
            <i class="fa-solid fa-lock arrow-right" style="font-size: 11px; opacity: 0.3;"></i>
        </div>

        <div class="ambient-btn coming-soon" onclick="alert('O Espaço Moda & Estilo está preparando uma seleção exclusiva e estará disponível em breve!')">
            <i class="fa-solid fa-shirt icon-left"></i>
            <span class="btn-text">
                <span>Espaço Moda, Estilo & Corpo</span>
                <span class="coming-soon-badge">Em breve</span>
            </span>
            <i class="fa-solid fa-lock arrow-right" style="font-size: 11px; opacity: 0.3;"></i>
        </div>

        <div class="footer">
            © Escolha Inteligente • Plataforma Premium Verificada
        </div>
    </div>
</body>
</html>
