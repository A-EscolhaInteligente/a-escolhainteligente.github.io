<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha Inteligente | Casa & Decoração</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f7f5f0;
            --text-main: #252525;
            --accent-gold: #b59b85;
            --button-bg: #ffffff;
            --font-base: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-base);
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
        }

        .container {
            width: 90%;
            max-width: 400px;
            padding: 30px 24px;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.03);
        }

        .top-nav {
            margin-bottom: 24px;
            text-align: left;
        }

        .back-btn {
            color: var(--text-main);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
            text-align: left;
        }

        .room-btn {
            display: flex;
            align-items: center;
            background-color: var(--button-bg);
            color: var(--text-main);
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 18px;
            margin-bottom: 12px;
            border: 1px solid #eaeaea;
            transition: all 0.2s ease;
        }

        .room-btn:hover {
            border-color: var(--accent-gold);
            background-color: #fdfbf7;
            transform: translateY(-1px);
        }

        .room-btn i.icon-left {
            font-size: 20px;
            margin-right: 16px;
            color: var(--accent-gold);
            width: 24px;
            text-align: center;
        }

        .room-btn span {
            flex-grow: 1;
            text-align: left;
            font-size: 15px;
            font-weight: 600;
        }

        .room-btn i.arrow-right {
            font-size: 12px;
            color: #cccccc;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 11px;
            color: #c0c0c0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-nav">
            <a href="index.html" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i> Voltar ao início
            </a>
        </div>

        <h1 class="page-title">Escolha o Cômodo</h1>
        
        <a href="casa-sala.html" class="room-btn">
            <i class="fa-solid fa-couch icon-left"></i>
            <span>Sala de Estar</span>
            <i class="fa-solid fa-chevron-right arrow-right"></i>
        </a>
        
        <a href="#" class="room-btn" onclick="alert('Em breve vamos montar o Quarto juntos!')">
            <i class="fa-solid fa-bed icon-left"></i>
            <span>Quarto Principal</span>
            <i class="fa-solid fa-chevron-right arrow-right"></i>
        </a>

        <a href="#" class="room-btn" onclick="alert('Em breve vamos montar a Cozinha juntos!')">
            <i class="fa-solid fa-kitchen-set icon-left"></i>
            <span>Cozinha & Área Gourmet</span>
            <i class="fa-solid fa-chevron-right arrow-right"></i>
        </a>

        <a href="#" class="room-btn" onclick="alert('Em breve vamos montar o Banheiro juntos!')">
            <i class="fa-solid fa-bath icon-left"></i>
            <span>Banheiro & Lavabo</span>
            <i class="fa-solid fa-chevron-right arrow-right"></i>
        </a>

        <a href="#" class="room-btn" onclick="alert('Em breve vamos montar a Lavanderia juntos!')">
            <i class="fa-solid fa-soap icon-left"></i>
            <span>Lavanderia & Limpeza</span>
            <i class="fa-solid fa-chevron-right arrow-right"></i>
        </a>

        <a href="#" class="room-btn" onclick="alert('Em breve vamos montar a Área de Lazer juntos!')">
            <i class="fa-solid fa-umbrella-beach icon-left"></i>
            <span>Lazer & Área Externa</span>
            <i class="fa-solid fa-chevron-right arrow-right"></i>
        </a>

        <div class="footer">
            © Escolha Inteligente
        </div>
    </div>
</body>
</html>
